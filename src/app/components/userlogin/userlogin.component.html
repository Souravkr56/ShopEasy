<div class="login-page">

  <div class="login-container">

    <!-- Logo -->
    <div class="logo">
      <a routerLink="/">ShopEasy</a>
    </div>

    <h2>Welcome Back!</h2>

    <p class="subtitle">
      Login to your account
    </p>

    <!-- Login Form -->
    <form (ngSubmit)="login()">

      <!-- Email -->
      <div class="form-group">

        <label for="email">
          Email Address
        </label>

        <input
          type="email"
          id="email"
          name="email"
          placeholder="Enter your email"
          [(ngModel)]="email"
          required
        >

      </div>

      <!-- Password -->
      <div class="form-group">

        <label for="password">
          Password
        </label>

        <input
          type="password"
          id="password"
          name="password"
          placeholder="Enter your password"
          [(ngModel)]="password"
          required
        >

      </div>

      <!-- Remember & Forgot -->
      <div class="login-options">

        <label class="remember">

          <input
            type="checkbox"
            name="remember"
            [(ngModel)]="rememberMe"
          >

          Remember me

        </label>

        <a routerLink="/forgot-password">
          Forgot Password?
        </a>

      </div>

      <!-- Login Button -->
      <button
        type="submit"
        class="login-button"
      >
        Login
      </button>

    </form>

    <!-- Register -->
    <div class="register">

      <span>
        Don't have an account?
      </span>

      <a routerLink="/register">
        Create Account
      </a>

    </div>

    <!-- Divider -->
    <div class="divider">
      <span>OR</span>
    </div>

    <!-- Social Login -->
    <button class="google-button">
      Continue with Google
    </button>

  </div>

</div>
